
<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sistema Candango de Salvamento — Escalas de Plantão</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #031a30;
    color: #233b50;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* ESTRUTURA PRINCIPAL */

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    border: 2px solid #1177b4;
    border-radius: 12px;
    overflow: hidden;
    background: #f8fbfe;
}

/* CABEÇALHO */

.topbar {
    height: 65px;
    min-height: 65px;
    background: #052441;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: white;
    color: #07518a;
    display: grid;
    place-items: center;
    font-size: 28px;
    font-weight: bold;
}

.brand h1 {
    font-size: 25px;
}

.profile-label {
    border-left: 1px solid #42627c;
    padding-left: 18px;
    font-size: 14px;
    color: #d1e0ed;
}

.more-button {
    background: transparent;
    border: none;
    color: white;
    font-size: 25px;
}

/* LAYOUT */

.layout {
    display: flex;
    flex: 1;
    min-height: calc(100vh - 65px);
}

/* MENU LATERAL */

.sidebar {
    width: 210px;
    min-width: 210px;
    background: #052442;
    padding-top: 20px;
    border-right: 1px solid #17496b;
}

.menu-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 19px;
    border: none;
    border-left: 4px solid transparent;
    background: transparent;
    color: #d2e1ee;
    font-size: 14px;
    text-align: left;
    transition: .2s;
}

.menu-item:hover {
    background: #0b416f;
}

.menu-item.active {
    background: #10518a;
    border-left-color: #32b9ef;
    color: white;
    font-weight: bold;
}

.menu-icon {
    width: 24px;
    text-align: center;
    font-size: 20px;
}

/* CONTEÚDO */

.main-content {
    flex: 1;
    min-width: 0;
    background: #f8fbfe;
    padding: 25px;
}

.content-card {
    max-width: 1150px;
    margin: 0 auto;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.section-header h2 {
    font-size: 25px;
    color: #173b58;
}

.primary-button {
    border: none;
    border-radius: 7px;
    background: #063e70;
    color: white;
    padding: 14px 22px;
    font-size: 14px;
    font-weight: bold;
    transition: .2s;
}

.primary-button:hover {
    background: #08639f;
}

/* TABELA */

.table-wrapper {
    background: white;
    border: 1px solid #dce6ee;
    border-radius: 10px;
    overflow-x: auto;
    box-shadow: 0 2px 8px #17364e0a;
}

.schedule-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.schedule-table th {
    padding: 20px 17px;
    text-align: left;
    color: #50687b;
    background: #f8fafc;
    border-bottom: 1px solid #e2eaf0;
    font-weight: bold;
}

.schedule-table td {
    padding: 22px 17px;
    border-bottom: 1px solid #e5ecf2;
    color: #334d62;
}

.schedule-table tbody tr:last-child td {
    border-bottom: none;
}

.schedule-table tbody tr:hover {
    background: #f5faff;
}

.status-badge {
    display: inline-block;
    min-width: 75px;
    text-align: center;
    padding: 6px 13px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: bold;
}

.status-badge.active {
    background: #d6f4e6;
    color: #0a8d65;
}

.status-badge.inactive {
    background: #e8edf2;
    color: #738698;
}

/* AÇÕES */

.actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
}

.icon-button {
    background: transparent;
    border: none;
    color: #426d8e;
    font-size: 18px;
    padding: 7px;
    border-radius: 5px;
}

.icon-button:hover {
    background: #e8f2f9;
}

.icon-button.delete:hover {
    color: #df3d46;
}

.empty-message {
    text-align: center;
    padding: 35px;
    color: #8497a7;
}

/* MODAL */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #00192fc4;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 490px;
    background: white;
    border-radius: 12px;
    padding: 27px;
    box-shadow: 0 12px 40px #0004;
}

.modal h2 {
    font-size: 22px;
    color: #183e5c;
    margin-bottom: 22px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd9e4;
    border-radius: 7px;
    background: white;
    color: #28475e;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #087bb8;
    box-shadow: 0 0 0 3px #087bb81a;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 25px;
}

.cancel-button,
.save-button {
    border-radius: 7px;
    padding: 12px 20px;
    font-weight: bold;
    font-size: 14px;
}

.cancel-button {
    border: 1px solid #8fb2cb;
    background: white;
    color: #28628d;
}

.save-button {
    border: 1px solid #07528c;
    background: #07528c;
    color: white;
}

.save-button:hover {
    background: #0869a8;
}

/* NOTIFICAÇÃO */

.toast {
    display: none;
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 3000;
    background: #08775c;
    color: white;
    padding: 15px 22px;
    border-radius: 8px;
    box-shadow: 0 5px 20px #0004;
    font-size: 14px;
}

/* RESPONSIVIDADE */

@media(max-width: 850px) {
    .sidebar {
        width: 70px;
        min-width: 70px;
    }

    .menu-item {
        justify-content: center;
        padding: 17px 5px;
    }

    .menu-label {
        display: none;
    }

    .main-content {
        padding: 20px;
    }
}

@media(max-width: 550px) {
    .layout {
        flex-direction: column;
    }

    .sidebar {
        order: 2;
        width: 100%;
        min-width: 100%;
        height: 65px;
        display: flex;
        padding: 0;
        border-top: 1px solid #17496b;
    }

    .menu-item {
        flex: 1;
        border-left: none;
        border-top: 3px solid transparent;
    }

    .menu-item.active {
        border-left: none;
        border-top-color: #32b9ef;
    }

    .main-content {
        padding: 18px 12px;
    }

    .section-header h2 {
        font-size: 20px;
    }

    .primary-button {
        padding: 12px;
        font-size: 12px;
    }

    .schedule-table {
        min-width: 590px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }
}
</style>

<body>
<div class="app">
<!-- CABEÇALHO -->
<header class="topbar scs-unified-header"><div class="scs-header-brand"><div aria-hidden="true" class="scs-header-logo"><img alt="Logomarca do Sistema Candango de Salvamento" src="../logo-sistema-candango.png"/></div><strong class="scs-header-title">Sistema Candango de Salvamento</strong><span class="scs-header-role">Socorrista</span></div><div class="scs-header-user"><span class="scs-header-avatar"><svg aria-hidden="true" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg></span><span class="scs-header-username">Socorrista</span></div></header>
<div class="layout">
<!-- MENU LATERAL -->
<nav class="sidebar"><a class="menu-item" href="ocorrencias.html"><span class="scs-menu-icon"><svg aria-hidden="true" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m3 10 9-7 9 7"></path><path d="M5 9v12h14V9"></path><path d="M9 21v-7h6v7"></path></svg></span><span class="menu-label">Início</span></a><a class="menu-item" href="ocorrencias.html"><span class="scs-menu-icon"><svg aria-hidden="true" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect height="16" rx="2" width="16" x="4" y="4"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg></span><span class="menu-label">Ocorrências</span></a><a class="menu-item" href="mapa.html"><span class="scs-menu-icon"><svg aria-hidden="true" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"></path></svg></span><span class="menu-label">Mapa</span></a><a class="menu-item active" href="escalas.html"><span class="scs-menu-icon"><svg aria-hidden="true" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect height="16" rx="2" width="18" x="3" y="5"></rect><path d="M7 3v4M17 3v4M3 10h18M7 14h3M14 14h3"></path></svg></span><span class="menu-label">Escala de Plantão</span></a><a class="menu-item" href="editar_socorrista.html"><span class="scs-menu-icon"><svg aria-hidden="true" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-2a8 8 0 0 1 16 0v2"></path></svg></span><span class="menu-label">Perfil</span></a><a class="menu-item" href="../index.html"><span class="scs-menu-icon"><svg aria-hidden="true" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10 17l5-5-5-5M15 12H3"></path><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"></path></svg></span><span class="menu-label">Sair</span></a></nav>
<!-- CONTEÚDO -->
<main class="main-content">
<div class="content-card">
<div class="section-header">
<h2>Escalas de Plantão</h2>
<button class="primary-button" onclick="openScheduleModal()">
                        + Nova Escala
                    </button>
</div>
<!-- TABELA -->
<div class="table-wrapper">
<table class="schedule-table">
<thead>
<tr>
<th>Data</th>
<th>Turno</th>
<th>Socorristas</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="scheduleTable"></tbody>
</table>
</div>
</div>
</main>
</div>
</div>
<!-- MODAL -->
<div class="modal-overlay" id="scheduleModal">
<div class="modal">
<h2 id="modalTitle">Nova Escala de Plantão</h2>
<form id="scheduleForm">
<div class="form-group">
<label for="scheduleDate">Data do plantão</label>
<input id="scheduleDate" required="" type="date"/>
</div>
<div class="form-row">
<div class="form-group">
<label for="scheduleShift">Turno</label>
<select id="scheduleShift">
<option value="Manhã">Manhã</option>
<option value="Tarde">Tarde</option>
<option value="Noite">Noite</option>
</select>
</div>
<div class="form-group">
<label for="scheduleRescuers">Socorristas</label>
<input id="scheduleRescuers" max="100" min="1" required="" type="number" value="2"/>
</div>
</div>
<div class="form-group">
<label for="scheduleStatus">Status</label>
<select id="scheduleStatus">
<option value="active">Ativa</option>
<option value="inactive">Inativa</option>
</select>
</div>
<div class="modal-actions">
<button class="cancel-button" onclick="closeScheduleModal()" type="button">
                    Cancelar
                </button>
<button class="save-button" type="submit">
                    Salvar Escala
                </button>
</div>
</form>
</div>
</div>
<div class="toast" id="toast"></div>
<script>

/* =====================================
   DADOS DEMONSTRATIVOS
===================================== */

const defaultSchedules = [
    {
        id: 1,
        date: "2025-06-16",
        shift: "Manhã",
        rescuers: 2,
        status: "active"
    },
    {
        id: 2,
        date: "2025-06-16",
        shift: "Tarde",
        rescuers: 2,
        status: "active"
    },
    {
        id: 3,
        date: "2025-06-16",
        shift: "Noite",
        rescuers: 3,
        status: "active"
    },
    {
        id: 4,
        date: "2025-06-17",
        shift: "Manhã",
        rescuers: 2,
        status: "active"
    }
];

const storageKey = "scs_schedules";

function loadSchedules() {

    try {
        const saved = localStorage.getItem(storageKey);

        return saved !== null
            ? JSON.parse(saved)
            : structuredClone(defaultSchedules);

    } catch (error) {
        return structuredClone(defaultSchedules);
    }

}

let schedules = loadSchedules();
let editingId = null;


/* =====================================
   SALVAR NO NAVEGADOR
===================================== */

function saveSchedules() {

    try {
        localStorage.setItem(
            storageKey,
            JSON.stringify(schedules)
        );
    } catch (error) {
        showToast("Não foi possível armazenar os dados no navegador.");
    }

}


/* =====================================
   FORMATAR DATA
===================================== */

function formatDate(dateString) {

    const parts = dateString.split("-");

    if (parts.length !== 3) return dateString;

    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* =====================================
   RENDERIZAR TABELA
===================================== */

function renderSchedules() {

    const table = document.getElementById("scheduleTable");

    table.innerHTML = "";

    if (schedules.length === 0) {

        const row = document.createElement("tr");

        const cell = document.createElement("td");
        cell.colSpan = 5;
        cell.className = "empty-message";
        cell.textContent = "Nenhuma escala cadastrada.";

        row.appendChild(cell);
        table.appendChild(row);

        return;
    }

    const sorted = [...schedules].sort((a, b) => {

        const dateComparison = a.date.localeCompare(b.date);

        if (dateComparison !== 0) return dateComparison;

        const shiftOrder = {
            "Manhã": 1,
            "Tarde": 2,
            "Noite": 3
        };

        return shiftOrder[a.shift] - shiftOrder[b.shift];

    });

    sorted.forEach(schedule => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${formatDate(schedule.date)}</td>
            <td></td>
            <td>${schedule.rescuers}</td>
            <td>
                <span class="status-badge ${schedule.status}">
                    ${schedule.status === "active" ? "Ativa" : "Inativa"}
                </span>
            </td>
            <td>
                <div class="actions">
                    <button class="icon-button edit-button"
                        title="Editar escala">✎</button>

                    <button class="icon-button toggle-button"
                        title="Ativar ou desativar">◉</button>

                    <button class="icon-button delete delete-button"
                        title="Excluir escala">×</button>
                </div>
            </td>
        `;

        row.children[1].textContent = schedule.shift;

        row.querySelector(".edit-button").onclick =
            () => editSchedule(schedule.id);

        row.querySelector(".toggle-button").onclick =
            () => toggleSchedule(schedule.id);

        row.querySelector(".delete-button").onclick =
            () => deleteSchedule(schedule.id);

        table.appendChild(row);

    });

}


/* =====================================
   ABRIR MODAL
===================================== */

function openScheduleModal() {

    editingId = null;

    document.getElementById("modalTitle")
        .textContent = "Nova Escala de Plantão";

    document.getElementById("scheduleForm").reset();

    document.getElementById("scheduleDate").value =
        new Date().toLocaleDateString("en-CA");

    document.getElementById("scheduleModal")
        .classList.add("active");

}


/* =====================================
   EDITAR ESCALA
===================================== */

function editSchedule(id) {

    const schedule = schedules.find(item => item.id === id);

    if (!schedule) return;

    editingId = id;

    document.getElementById("modalTitle")
        .textContent = "Editar Escala de Plantão";

    document.getElementById("scheduleDate").value =
        schedule.date;

    document.getElementById("scheduleShift").value =
        schedule.shift;

    document.getElementById("scheduleRescuers").value =
        schedule.rescuers;

    document.getElementById("scheduleStatus").value =
        schedule.status;

    document.getElementById("scheduleModal")
        .classList.add("active");

}


/* =====================================
   FECHAR MODAL
===================================== */

function closeScheduleModal() {

    document.getElementById("scheduleModal")
        .classList.remove("active");

}


/* =====================================
   SALVAR ESCALA
===================================== */

document.getElementById("scheduleForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const date = document.getElementById("scheduleDate").value;

        const shift = document.getElementById("scheduleShift").value;

        const rescuers = Number(
            document.getElementById("scheduleRescuers").value
        );

        const status = document.getElementById("scheduleStatus").value;

        if (!date || !Number.isInteger(rescuers) ||
            rescuers < 1 || rescuers > 100) {

            alert("Preencha os dados corretamente.");
            return;

        }

        const duplicate = schedules.some(item =>
            item.date === date &&
            item.shift === shift &&
            item.id !== editingId
        );

        if (duplicate) {
            alert("Já existe uma escala cadastrada para esta data e turno.");
            return;
        }

        if (editingId !== null) {

            const schedule = schedules.find(
                item => item.id === editingId
            );

            if (schedule) {
                schedule.date = date;
                schedule.shift = shift;
                schedule.rescuers = rescuers;
                schedule.status = status;
            }

            showToast("Escala atualizada com sucesso!");

        } else {

            schedules.push({
                id: Date.now(),
                date: date,
                shift: shift,
                rescuers: rescuers,
                status: status
            });

            showToast("Nova escala cadastrada!");

        }

        saveSchedules();
        renderSchedules();
        closeScheduleModal();

    });


/* =====================================
   ATIVAR / DESATIVAR
===================================== */

function toggleSchedule(id) {

    const schedule = schedules.find(item => item.id === id);

    if (!schedule) return;

    schedule.status =
        schedule.status === "active"
            ? "inactive"
            : "active";

    saveSchedules();
    renderSchedules();

    showToast("Status da escala atualizado!");

}


/* =====================================
   EXCLUIR
===================================== */

function deleteSchedule(id) {

    const schedule = schedules.find(item => item.id === id);

    if (!schedule) return;

    const confirmed = confirm(
        "Deseja excluir a escala de " +
        formatDate(schedule.date) +
        " - " + schedule.shift + "?"
    );

    if (!confirmed) return;

    schedules = schedules.filter(item => item.id !== id);

    saveSchedules();
    renderSchedules();

    showToast("Escala excluída!");

}


/* =====================================
   MENU
===================================== */

function menuClick(page) {
 const routes = {"Início": "ocorrencias.html", "Ocorrências": "ocorrencias.html", "Perfil": "editar_socorrista.html", "Relatórios": "../adms/relatorios.html"};
 if(page === "Sair" || page === "Saída") { if(confirm("Deseja sair do sistema?")) window.location.href="../index.html"; return; }
 if(routes[page]) { window.location.href=routes[page]; return; }
 alert("Esta funcionalidade ainda não possui uma página neste projeto.");
}


/* =====================================
   NOTIFICAÇÃO
===================================== */

let toastTimer;

function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.style.display = "none";
    }, 3000);

}


/* =====================================
   INICIALIZAR
===================================== */

document.addEventListener("DOMContentLoaded", () => {

    renderSchedules();

    document.getElementById("scheduleModal")
        .addEventListener("click", function(event) {

            if (event.target === this) {
                closeScheduleModal();
            }

        });

    document.addEventListener("keydown", function(event) {

        if (event.key === "Escape") {
            closeScheduleModal();
        }

    });

});

</script>
